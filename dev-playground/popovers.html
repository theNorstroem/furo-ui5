<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,  initial-scale=1.0">
  <title>Popover</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <script type="module">

    import "@/Assets"
    import "@/elements/button"
    import "@/elements/popover"
    import "@/elements/responsive-popover"
    // import playground-web-components here
    // import "@/Button";

  </script>

  <style>
    body {
      background-color: var(--sapBackgroundColor);
      padding: 1rem;
    }

    *:not(:defined) {
      display: none;
    }
  </style>
</head>
<body class="sapUiSizeCompact">

<main>
  <h1>Popover</h1>

  <furo-ui5-button id="opener" at-click="--openClicked">Open</furo-ui5-button>
  <furo-ui5-popover opener="opener" header-text="Header" fn-show="--openClicked">Content</furo-ui5-popover>
  <furo-ui5-button id="responsive-opener" at-click="--openResponsiveClicked">Open</furo-ui5-button>
  <furo-ui5-responsive-popover opener="responsive-opener" header-text="Responsive" fn-show="--openResponsiveClicked">
    Content
    responsive
  </furo-ui5-responsive-popover>
</main>

</body>


<script type="module">
  import {DOMFBP} from "@furo/fbp/src/DOMFBP";
  // append fbp to the body
  const fbproot = new DOMFBP(document.body);
  fbproot._FBPTraceWires();
</script>
</html>
